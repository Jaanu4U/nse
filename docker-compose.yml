services:
  db:
    image: postgres:16-alpine
    container_name: nse_platform_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nse_stock_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nse_stock_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nse_platform_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: nse_platform_backend
    restart: always
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/nse_stock_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=supersecretkeychangeinproduction1234567890
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/workspace
      - /var/run/docker.sock:/var/run/docker.sock:ro

  frontend:
    build: ./frontend
    container_name: nse_platform_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_DELTA_API_URL=/delta-api
      - NEXT_PUBLIC_DELTA_STREAM_URL=/delta-stream
      - NODE_ENV=production
    ports:
      - "3000:3000"

  delta:
    build: ./backend/java-market-ingest
    container_name: nse_platform_delta
    restart: always
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=nse_stock_db
      - DB_USER=postgres
      - DB_PASS=postgrespassword
      - SPRING_FLYWAY_ENABLED=false
      # KITE_API_KEY, KITE_API_SECRET, KITE_ACCESS_TOKEN come from env_file above
    ports:
      - "8090:8090"

volumes:
  postgres_data:
  redis_data:
